name: CI - Build Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v3

      - name: 🐳 Installer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Builder l'image Docker
        run: docker build -t projet-bda-react-js .

      - name: ✅ Vérifier que l'image existe
        run: docker images projet-bda-react-js